<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Objeto Window - Guillermo</title>
</head>
<body>
    <main>
        <section>
            <h2>alert()</h2>
            <button onclick="pulsarAlert()">Probar alerta</button>
        </section>
        <section>
            <h2>blur()</h2>
            <button onclick="pulsarBlur()">Probar blur</button>
        </section>
        <section>
            <h2>close()</h2>
            <button onclick="pulsarClose()">Probar close</button>
        </section>
        <section>
            <h2>confirm()</h2>
            <button onclick="pulsarConfirm()">Probar confirm</button>
            <p id="confirmar"></p>
        </section>
        <section>
            <h2>focus()</h2>

        </section>
        <section>
            <h2>moveBy()</h2>

        </section>
        <section>
            <h2>moveTo()</h2>

        </section>
        <section>
            <h2>open()</h2>
            <button onclick="pulsarOpen()">Probar open</button>
        </section>
    </main>

    <script>
        function pulsarAlert() {
            // "window.alert" no es necesario; tan solo "alert" sería correcto, puesto que siempre partimos de window por defecto
            window.alert("Vamos a aprender el objeto Window :))");
        }

        function pulsarBlur() {
            // Este ejemplo es el utilizado en la página del consorcio, pero "blur()" está en desuso, por lo que no funciona (al menos en este navegador)
            const VENTANA = window.open("", "", "width=200, height=100");
            VENTANA.blur();
        }

        function pulsarClose() {
            window.close();
        }

        function pulsarConfirm() {
            if (window.confirm("Acepta o cancela")) {
                document.getElementById("confirmar").innerHTML = "Se ha CONFIRMADO."
            } else {
                document.getElementById("confirmar").innerHTML = "Se ha CANCELADO."
            }
        }

        function pulsarOpen() {
            let pagina = "sandra.html";
            open(pagina);
        }
    </script>
</body>
</html>
