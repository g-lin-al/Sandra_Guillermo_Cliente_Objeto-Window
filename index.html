<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Objeto Window - Guillermo</title>
</head>
<body>
    <main>
        <section>
            <h2>alert()</h2>
            <button onclick="pulsarAlert()">Probar alerta</button>
        </section>
        <section>
            <h2>blur()</h2>
            <button onclick="pulsarBlur()">Probar blur</button>
        </section>
        <section>
            <h2>close()</h2>
            <button onclick="pulsarAbrirPrueba()">Abrir pestaña</button>
            <button onclick="pulsarClose()">Probar close</button>
        </section>
        <section>
            <h2>confirm()</h2>
            <button onclick="pulsarConfirm()">Probar confirm</button>
            <p id="confirmar"></p>
        </section>
        <section>
            <h2>focus()</h2>
            <button onclick="pulsarAbrirPrueba()">Abrir pestaña</button>
            <button onclick="pulsarFoco()">Dar foco</button>
        </section>
        <section>
            <h2>moveBy()</h2>
            <button onclick="pulsarAbrirPrueba()">Abrir pestaña</button>
            <button onclick="pulsarMoveBy()">Probar moveBy</button>
        </section>
        <section>
            <h2>moveTo()</h2>
            <button onclick="pulsarAbrirPrueba()">Abrir pestaña</button>
            <button onclick="pulsarMoveTo()">Probar moveTo</button>
        </section>
        <section>
            <h2>open()</h2>
            <button onclick="pulsarOpen()">Continuar</button>
        </section>
    </main>

    <script>
        let ventana;

        function pulsarAbrirPrueba() {
            ventana = window.open("https://www.arcipreste.org", "", "width=400, height=450");
        }

        function pulsarAlert() {
            window.alert("Vamos a aprender el objeto Window :))");
        }

        function pulsarBlur() {
            // Este ejemplo es el utilizado en la página del consorcio, pero "blur()" está en desuso, por lo que no funciona (al menos en este navegador)
            window.blur();
        }

        function pulsarClose() {
            ventana.close();
        }

        function pulsarConfirm() {
            if (window.confirm("Acepta o cancela")) {
                document.getElementById("confirmar").innerHTML = "Se ha CONFIRMADO."
            } else {
                document.getElementById("confirmar").innerHTML = "Se ha CANCELADO."
            }
        }

        function pulsarFoco() {
            ventana.focus();
        }
        
        function pulsarMoveBy() {
            window.moveBy(75, 75);
        }
        
        function pulsarMoveTo() {
            window.moveTo(150, 150);
        }

        function pulsarOpen() {
            let pagina = "sandra.html";
            open(pagina);
        }
    </script>
</body>
</html>
